:root{--ink:#1b2424;--green:#167256;--dark:#133b30;--soft:#eef4f1;--muted:#727b78;--line:#dce2df;--red:#c1564c;--white:#fff;--paper:#f4f6f5;--mono:'Blank Mono',monospace;font-family:'Blank Sans',Arial,sans-serif;color:var(--ink);background:var(--white);font-synthesis:none}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:28px}body{margin:0;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button,a,input,select,textarea,summary{outline-offset:4px}:focus-visible{outline:2px solid var(--green)}button{display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;border:1px solid #ced7d2;background:white;border-radius:3px;padding:10px 16px;color:var(--ink);font-size:14px;line-height:1.3;min-height:40px;font-weight:400;transition:background .15s,border-color .15s,color .15s}button:hover{background:#edf2ef;border-color:#9caf9f}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--green);color:white;border-color:var(--green)}button.primary:hover{background:var(--dark);border-color:var(--dark)}button.danger{color:var(--red)}button.added{background:var(--soft);color:var(--green)}button.text-button{background:transparent;border-color:transparent;padding:4px 0;min-height:30px;color:var(--green)}button.text-button:hover{color:var(--ink)}button .icon{width:17px;height:17px;flex-shrink:0}.icon{display:inline-block;width:20px;height:20px;vertical-align:middle;flex-shrink:0}a{color:inherit;text-decoration:none}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-weight:400}h1{font-size:36px;line-height:1.15;letter-spacing:-1.3px}h2{font-size:24px;line-height:1.25;letter-spacing:-.5px}h3{font-size:18px;line-height:1.3}.muted,small{color:var(--muted)}small{font-size:13px;line-height:1.4}.positive{color:var(--green)}.negative{color:var(--red)}.numeric{font-variant-numeric:tabular-nums;font-family:var(--mono)}.brand{display:inline-flex;align-items:center;gap:10px;letter-spacing:-1px;font-size:25px;font-weight:600;line-height:1;white-space:nowrap;border:0;background:transparent;padding:0;color:var(--ink)}button.brand:hover{background:transparent}.brand-blank{font-weight:400;color:var(--green);margin-left:5px}.brand-mark{display:inline-flex;gap:3px;height:22px;align-items:flex-end;width:23px}.brand-mark i{display:block;background:var(--green);width:5px;height:18px;transform:skewY(-20deg)}.brand-mark i:nth-child(2){height:22px}.brand-mark i:nth-child(3){height:13px}.eyebrow,.section-index{font-family:var(--mono);font-size:12px;letter-spacing:1.1px;font-weight:400;color:var(--green);display:block}.fineprint{font-size:13px;line-height:1.6;color:var(--muted)}.pill{display:inline-flex;align-items:center;padding:4px 8px;background:var(--soft);color:var(--green);font:11px/1.2 var(--mono);letter-spacing:.3px;border-radius:2px;white-space:nowrap}.pill.outline{background:transparent;border:1px solid var(--line);color:var(--muted)}.pill.warn{background:#f8f1e6;color:#816b44}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.pair{display:flex;justify-content:space-between;align-items:center;gap:16px}.pair h2{margin:0}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.text-link{display:inline-flex;align-items:center;gap:25px;border-bottom:1px solid var(--ink);padding-bottom:8px;font-size:14px}
/* Public page: oversized type, open composition, a full-width product perspective. */
.publicnav{max-width:1320px;margin:auto;padding:30px 48px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}.publicnav nav{display:flex;align-items:center;gap:35px;font-size:14px}.publicnav nav a:hover{color:var(--green)}.publicnav .primary{padding:12px 20px}.hero{max-width:1320px;margin:auto;padding:32px 48px 44px}.hero-label{display:flex;justify-content:space-between;gap:30px;padding-bottom:34px}.hero-label .eyebrow{color:var(--muted);font-size:11px}.edition{font:11px var(--mono);color:var(--muted)}.hero-heading{display:grid;grid-template-columns:1.55fr 1fr;align-items:center;gap:60px;padding-bottom:50px}.hero h1{font-size:clamp(76px,8.7vw,124px);line-height:.97;letter-spacing:-7px;margin:0}.hero h1>span{color:var(--green)}.hero-aside{padding:30px 0 0 55px}.hero-aside p{font-size:23px;line-height:1.42;letter-spacing:-.35px;margin-bottom:24px}.hero-aside .primary{padding:14px 19px;gap:25px}.hero-aside .fineprint{display:block;margin-top:18px}.hero-product{background:#edf0ee;border:1px solid #e3e8e5;perspective:1800px;padding:44px 62px 60px;overflow:hidden;position:relative}.terminal-perspective{border:1px solid #b8c9be;background:#fff;box-shadow:0 2px 0 #c5d0c9,0 5px 0 #d0d9d3,0 8px 0 #d7ded9,16px 25px 35px #1b382722;transform:rotateX(7deg) rotateY(-5deg) rotateZ(-1.2deg);transform-origin:center;transition:transform .8s cubic-bezier(.2,.8,.2,1)}.hero-product:hover .terminal-perspective{transform:rotateX(2deg) rotateY(-2deg) rotateZ(-.3deg)}.terminal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 23px;border-bottom:1px solid var(--line);background:white}.terminal-wordmark{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:600;letter-spacing:-.8px}.terminal-wordmark .brand-mark{transform:scale(.8)}.terminal-caption,.terminal-demo{font:10px var(--mono);letter-spacing:1px;color:var(--muted)}.terminal-demo{color:var(--green)}.terminal-body{display:grid;grid-template-columns:220px 1fr}.terminal-watch{border-right:1px solid var(--line);padding-top:16px}.mini-heading{font:10px var(--mono);letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between}.terminal-watch>.mini-heading{padding:0 16px 13px}.mini-stock{display:flex;justify-content:space-between;gap:15px;padding:15px 16px;border-top:1px solid var(--line);font-size:11px}.mini-stock.chosen{background:var(--soft);box-shadow:inset 2px 0 var(--green)}.mini-stock strong,.mini-stock b{font-size:12px;font-weight:400}.mini-stock span{display:block;font-size:10px;line-height:1.8}.mini-stock>div:last-child{text-align:right;font-family:var(--mono)}.terminal-note{font-size:20px;line-height:1.35;letter-spacing:-.5px;color:#80958a;padding:22px 20px;margin:0}.terminal-chart{padding:25px 27px 18px;min-width:0}.terminal-chart-head{display:flex;justify-content:space-between;align-items:flex-start}.terminal-chart-head h3{font-size:33px;letter-spacing:-1px;margin:8px 0 0}.terminal-chart-head h3 span{color:var(--muted)}.terminal-chart .candle-chart{margin:8px 0 15px}.terminal-measures{border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-top:15px;gap:15px}.terminal-measures span{font:9px var(--mono);letter-spacing:.7px;color:var(--muted);display:block}.terminal-measures b{display:block;font:15px var(--mono);margin-top:6px}.terminal-bottom{display:flex;justify-content:center;gap:30px;background:var(--dark);color:#bdd0c5;font-size:11px;padding:14px 20px;line-height:1}.terminal-bottom .selected{color:white}.hero-caption{display:flex;justify-content:space-between;gap:20px;padding-top:16px;font:11px var(--mono);color:var(--muted)}.landing-section{max-width:1224px;margin:0 auto;border-top:1px solid var(--line);padding:72px 0}.landing-section h2{font-size:45px;line-height:1.06;letter-spacing:-1.6px;margin:28px 0 0}.intro-section{display:grid;grid-template-columns:1.25fr 1fr;gap:80px}.intro-copy{padding-top:0}.intro-copy>p:first-child{font-size:23px;line-height:1.45;letter-spacing:-.4px}.intro-copy>p{font-size:16px;line-height:1.65}.intro-copy .text-link{margin-top:12px}.process-section{display:grid;grid-template-columns:1fr 1.5fr;gap:100px}.process-row{display:grid;grid-template-columns:45px 1fr;gap:25px;border-bottom:1px solid var(--line);padding:25px 0}.process-row:first-child{padding-top:0}.process-row:last-child{border-bottom:0;padding-bottom:0}.process-number{font:13px var(--mono);padding-top:5px;color:var(--green)}.process-row h3{font-size:26px;letter-spacing:-.7px;margin-bottom:12px}.process-row p{color:var(--muted);font-size:16px;line-height:1.6;max-width:430px;margin-bottom:13px}.process-tag{font:11px var(--mono);color:var(--green)}.feature-section{display:grid;grid-template-columns:1fr 1.5fr;gap:100px}.feature-list{display:grid;grid-template-columns:1fr 1fr;gap:36px}.feature-list article{border-top:1px solid var(--line);padding-top:14px}.feature-list article>span{font:11px var(--mono);color:var(--muted)}.feature-list h3{font-size:23px;letter-spacing:-.5px;margin:23px 0 12px}.feature-list p{font-size:15px;line-height:1.6;color:var(--muted);margin:0}.faq-section{display:grid;grid-template-columns:1fr 1.5fr;gap:100px}details{border-bottom:1px solid var(--line);padding:18px 0}details:first-child{padding-top:0}summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px;font-size:17px}summary::-webkit-details-marker{display:none}summary>span{color:var(--green);font-size:22px;line-height:1}details[open] summary>span{transform:rotate(45deg)}details p{margin:15px 30px 0 0;color:var(--muted);font-size:15px;line-height:1.6}.closing{margin:25px auto 0;padding:55px max(48px,calc((100vw - 1224px)/2));background:var(--dark);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:30px}.closing .section-index{color:#97b6a6}.closing h2{font-size:58px;line-height:1.1;letter-spacing:-2px;margin:18px 0 0}.closing button{background:#e3eee8;border-color:#e3eee8 function calculate({capital,entry,stopPercent,rewardMultiple,riskPercent,marginPercent=100,charges=0,quantity=null,side='BUY'}) {

    if(!Number.isFinite(value))throw Error(key+' must be a finite number');
  if(capital<=0||entry<=0||stopPercent<=0||stopPercent>=100||rewardMultiple<=0||riskPercent<=0||riskPercent>100||marginPercent<=0||marginPercent>100||charges<0)throw Error('Enter positive values; percentages must be within their allowed ranges.');

  const distance=entry*stopPercent/100, budget=capital*riskPercent/100;
  const affordable=Math.max(0,Math.floor((capital-charges)/(entry*marginPercent/100)));
  const riskQuantity=Math.max(0,Math.floor((budget-charges)/distance));
  const suggested=Math.min(affordable,riskQuantity);
  const qty=quantity===null?suggested:quantity;
  if(!Number.isSafeInteger(qty)||qty<0)throw Error('Quantity must be a non-negative whole number.');
  const direction=side==='BUY'?1:-1;
  const stop=entry-direction*distance,target=entry+direction*distance*rewardMultiple;
  if(target<=0)throw Error('Target must remain above zero.');
  const grossLoss=qty*distance,grossProfit=grossLoss*rewardMultiple;
  return {qty,suggested,affordable,riskQuantity,budget,stop,target,grossLoss,grossProfit,netLoss:grossLoss+charges,netProfit:grossProfit-charges,charges,requiredMargin:qty*entry*marginPercent/100,notional:qty*entry,overRisk:grossLoss+charges>budget+1e-8,overFunds:qty*entry*marginPercent/100+charges>capital+1e-8};

function candleChart(symbol='RELIANCE',interval='5m',compact=false){
 const st=stockData.find(x=>x.symbol===symbol)||stockData[0],count=interval==='1h'?18:interval==='15m'?28:46;
 const series=Array.from({length:count},(_,i)=>{const base=st.price*(.976+.024*i/(count-1)+.004*Math.sin(i*.72));const open=base+st.price*.002*Math.sin(i*2.1),close=base+st.price*.0025*Math.cos(i*1.8);return{open,close,high:Math.max(open,close)+st.price*.0025,low:Math.min(open,close)-st.price*.002,vol:15+Math.abs(Math.sin(i*1.2))*30+(i%7)*3}});
 const hi=Math.max(...series.map(x=>x.high))+st.price*.003,lo=Math.min(...series.map(x=>x.low))-st.price*.003;
 const y=v=>24+(hi-v)/(hi-lo)*205;const width=700,pitch=width/count;
 return `<svg class="candle-chart ${compact?'compact':''}" viewBox="0 0 790 300" role="img" aria-label="Fictional ${esc(symbol)} ${esc(interval)} candlestick example, not live market data">${Array.from({length:5},(_,i)=>{const v=hi-(hi-lo)*i/4;return `<line class="grid-line" x1="0" y1="${y(v)}" x2="710" y2="${y(v)}"/><text x="726" y="${y(v)+4}" class="axis-label">${v.toFixed(2)}</text>`}).join('')}${series.map((c,i)=>{const x=i*pitch+pitch/2,up=c.close>=c.open,col=up?'up':'down';return `<line class="candle ${col}" x1="${x}" x2="${x}" y1="${y(c.high)}" y2="${y(c.low)}"/><rect class="candle-body ${col}" x="${x-pitch*.24}" y="${Math.min(y(c.open),y(c.close))}" width="${pitch*.48}" height="${Math.max(1.5,Math.abs(y(c.open)-y(c.close)))}"/><rect class="volume ${col}" x="${x-pitch*.24}" y="${282-c.vol*.55}" width="${pitch*.48}" height="${c.vol*.55}"/>`}).join('')}<text class="axis-label" x="0" y="298">SESSION START</text><text class="axis-label" x="560" y="298">ILLUSTRATIVE BARS</text></svg>`;
}

function calculator(){const stocks=stockData.filter(x=>state.watch.includes(x.symbol));if(!stocks.length)return head('Risk calculator','Position size, stop and target — in one calculation.')+empty('Choose an instrument first','Add an instrument to your watchlist to begin.',button('Open Today','today','primary'));if(!stocks.some(s=>s.symbol===selected))selected=stocks[0].symbol;const s=stocks.find(x=>x.symbol===selected);return head('Risk calculator','Manual planning · All prices and margin inputs are illustrative.')+`<div class="calcgrid"><section class="panel"><div class="panel-heading"><h2>Position details</h2><span class="pill outline">MANUAL PLAN</span></div><form id="calcform"><div class="formgrid">${select('Watchlist instrument','symbol',stocks.map(s=>[s.symbol,s.symbol]),selected)}${select('Direction','side',[['BUY','Buy / long'],['SELL','Sell / short']],'BUY')}${field('Planning capital (₹)','capital',state.balance,'number','min="1" step="0.01"')}${field('Entry price (₹)','entry',s.price,'number','min="0.01" step="0.01"')}${select('Product','product',[['MIS','MIS · intraday'],['CNC','CNC · delivery']],'MIS')}${field('Illustrative margin (%)','margin',100,'number','min="0.01" max="100" step="0.01"')}${field('Account risk per trade (%)','risk',1,'number','min="0.01" max="100" step="0.01"')}${field('Stop distance from entry (%)','stop',1,'number','min="0.01" max="99" step="0.01"')}${select('Risk : reward','reward',[[2,'1 : 2'],[3,'1 : 3'],[4,'1 : 4'],['custom','Custom']],'3')}${field('Custom reward multiple','customreward',3,'number','min="0.1" step="0.1"')}${field('Estimated round-trip charges (₹)','charges',0,'number','min="0" step="0.01"')}${field('Quantity override (blank = automatic)','quantity','','number','min="0" step="1" placeholder="Automatic"')}</div><p class="muted">MIS changes margin requirements, not the share price. The live platform must obtain required margin from the broker.</p><button type="button" data-action="sync">Sync Zerodha balance</button></form></section><section class="panel summary"><div class="panel-heading"><h2>Order estimate</h2><span class="pill outline">NOT SUBMITTED</span></div><div id="calcout"></div></section></div>`}
function updateCalc(){try{const v=id=>document.getElementById(id).value;const product=v('product');if(product==='CNC')document.getElementById('margin').value=100;const c=calculate({capital:+v('capital'),entry:+v('entry'),marginPercent:+v('margin'),riskPercent:+v('risk'),stopPercent:+v('stop'),rewardMultiple:v('reward')==='custom'?+v('customreward'):+v('reward'),charges:+v('charges'),quantity:v('quantity')===''?null:+v('quantity'),side:v('side')});lastCalc={...c,symbol:v('symbol'),side:v('side'),entry:+v('entry'),product,capital:+v('capital'),riskPercent:+v('risk'),stopPercent:+v('stop'),marginPercent:+v('margin'),strategy:state.strategy};const unsupported=product==='CNC'&&v('side')==='SELL';document.querySelector('#calcout').innerHTML=rows([['Instrument',esc(v('symbol'))],['Sample entry',money(+v('entry'))],['Quantity',c.qty],['Automatic quantity',c.suggested],['Notional value',money(c.notional)],['Illustrative margin',money(c.requiredMargin)],['Planned stop',money(c.stop)],['Planned target',money(c.target)],['Loss at planned stop',money(c.grossLoss)],['Profit at planned target',money(c.grossProfit)],['Estimated costs',money(c.charges)],['Loss incl. estimated costs',money(c.netLoss)],['Profit after estimated costs',money(c.netProfit)]])+`<p><small>Slippage and price gaps can increase losses. Stop and target are plans, not active broker orders. Zero costs means no estimate was supplied.</small></p>${c.overRisk?'<p class="alert">Quantity exceeds your account-risk budget.</p>':''}${c.overFunds?'<p class="alert">Quantity exceeds illustrative buying power.</p>':''}${unsupported?'<p class="alert">Delivery sell requires verified holdings; unavailable in this prototype.</p>':''}<button data-action="prepare" class="primary" ${c.qty===0||c.overRisk||c.overFunds||unsupported?'disabled':''}>Add to order review →</button>`;}catch(e){lastCalc=null;document.querySelector('#calcout').innerHTML=`<p class="alert">${esc(e.message)}</p>`}}
function orders(){return head('Order review','Review local plans before connecting to execution.')+`<section class="panel">${state.drafts.length?state.drafts.map((d,i)=>`<div class="panel"><div class="pair"><h2>${esc(d.symbol)} · ${esc(d.side)} · ${esc(d.product)}</h2><span class="pill warn">LOCAL PLAN</span></div><div class="cols3"><div>${rows([['Quantity',d.qty],['Planned entry',money(d.entry)]])}</div><div>${rows([['Planned stop',money(d.stop)],['Planned target',money(d.target)]])}</div><div>${rows([['Estimated loss + costs',money(d.netLoss)],['Estimated profit - costs',money(d.netProfit)]])}</div></div><p><small>Created ${esc(new Date(d.createdAt).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}))} IST · ${esc(d.strategy)}</small></p><label class="check"><input type="checkbox"> I have reviewed this plan. Broker price and margin revalidation is still required.</label><div class="actions">${button('Place live order','live','primary')}${button('Remove plan','draftremove:'+i,'danger')}</div></div>`).join(''):empty('No prepared orders','Use the calculator to prepare a plan, then review it here.',button('Open calculator','calculator'))}</section><section class="panel"><div class="panel-heading"><h2>Broker orders & positions</h2><span class="pill outline">DISCONNECTED</span></div>${empty('No broker records','Broker acknowledgements, open orders, partial fills, executions, exits and rejections will appear here after integration.')}</section>`}
function tradebook(){return head('Trade book','Verified executions and imported history, kept separate.')+`<div class="cards">${stat('Executed trades','—','Broker disconnected')}${stat('Realised net P&L','—','Not available')}${stat('Charges','—','Not reconciled')}${stat('Open positions','—','Broker disconnected')}</div><section class="panel"><h2>Import history</h2><p class="muted">The production importer will preview Excel/CSV columns, validate dates and quantities, and detect duplicate broker trade IDs before saving.</p><button data-action="import">Import Excel / CSV</button></section><section class="panel">${empty('No verified trade history','Local order plans are not included in the trade book. A planned order does not establish an execution or a profit.')}</section>`}
function reports(){return head('Reports','Day, week and month exports from reconciled executions.',button('Print planning report','print','primary'))+`<div class="panel no-print">${select('Reporting period','period',[['day','Today'],['week','This week'],['month','This month']],period)}<p class="muted">No execution records are connected. The printable report below contains local plans only.</p></div><section class="panel"><div class="pair"><div><p class="eyebrow">Pirento Blank</p><h2>Planning report · ${esc(period)}</h2></div><span class="report-stamp">UNVERIFIED</span></div><p>Generated ${esc(new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}))} IST</p><p>Realised P&L: unavailable. Charges: estimates only. No profit/loss result can be certified from planned trades.</p><div class="tablewrap"><table><thead><tr><th>Instrument</th><th>Side / Qty</th><th>Entry</th><th>Stop / Target</th><th>Est. costs</th></tr></thead><tbody>${filteredDrafts().map(d=>`<tr><td>${esc(d.symbol)}<small>${esc(d.strategy)}</small></td><td>${esc(d.side)} / ${d.qty}</td><td>${money(d.entry)}</td><td>${money(d.stop)} / ${money(d.target)}</td><td>${money(d.charges)}</td></tr>`).join('')||'<tr><td colspan="5">No local plans in this period.</td></tr>'}</tbody></table></div><h3>Rules in effect</h3><p class="rule-copy">${esc(state.rules)}</p></section>`}
function filteredDrafts(){const now=new Date();const date=new Date(now.getTime()+330*60000);const start=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),period==='month'?1:date.getUTCDate()));if(period==='week')start.setUTCDate(start.getUTCDate()-(start.getUTCDay()+6)%7);const threshold=start.getTime()-330*60000;return state.drafts.filter(d=>Date.parse(d.createdAt)>=threshold&&Date.parse(d.createdAt)<=now.getTime())}
function strategy(){return head('Rules & strategy','Write your process. Keep revisions explicit.')+`<div class="cols2"><section class="panel"><h2>Your written strategy</h2>${field('Strategy name','strategyname',state.strategy,'text')}<label class="field">Entry, exit and invalidation conditions<textarea id="strategynotes" placeholder="Record the conditions you want to test…">${esc(state.notes)}</textarea></label>${button('Save strategy draft','savestrategy','primary')}<p><small>Saved locally as a research draft. No trading rules execute automatically.</small></p></section><section class="panel"><h2>Trading rules</h2><label class="field">One rule per line<textarea id="rules">${esc(state.rules)}</textarea></label>${button('Save rules','saverules','primary')}</section></div><section class="panel"><h2>Strategy promotion</h2><p class="muted">Draft → backtest → out-of-sample review → paper trading → your approval → active version.</p><p>AI suggestions must preserve the previous strategy version and show the evidence for each change.</p>${button('Discuss a strategy','chat')}</section>`}
function chatPage(){return head('Chat with AI','A conversation grounded in your trading record.')+`<section class="panel"><div class="notice">OpenAI is not connected. No generated market analysis is available.</div><div class="chatlog"><div class="chat-intro"><span class="eyebrow">PIRENTO / RESEARCH ASSISTANT</span><h2>What would you like<br>to understand?</h2><p>Review a trade, question a setup or develop a strategy.</p><div class="chat-prompts"><button type="button" data-action="prompt:Review my trading rules">Review my trading rules ${icon("arrow")}</button><button type="button" data-action="prompt:Help me define testable entry conditions">Define entry conditions ${icon("arrow")}</button></div></div>${chat.map(m=>`<div class="message ${m.role}">${esc(m.text)}</div>`).join('')}</div><form id="chatform"><label class="field">Your question<textarea id="question" placeholder="For example: Which rules did I break this week?" required></textarea></label><button class="primary">Send question</button></form></section>`}
function settings(){return head('Settings','Your profile, broker connection and planning preferences.')+`<div class="cols2"><section class="panel"><h2>Profile & session</h2><p>${apiState.user?esc(apiState.user.email):'Preview workspace · no signed-in user'}</p>${rows([['Login method','Invited email + password'],['Timezone','Asia/Kolkata'],['Membership',apiState.user?esc(apiState.user.role):'Demo']])}<div class="actions">${apiState.user?button('Sign out','logout'):button('Sign in','login')}${!apiState.user?button('Clear local plans','clear','danger'):''}</div></section><section class="panel"><h2>Trading connection</h2><div id="brokerstatus">${brokerStatusMarkup()}</div><p class="muted">Link through Zerodha authorization. Broker keys and session tokens stay on the server.</p><div class="actions">${button('Connect Zerodha','connect','primary')}${apiState.broker?.linked?button('Disconnect','disconnect','danger'):''}</div></section></div><section class="panel"><h2>Capital preferences</h2>${field('Manual planning capital (₹)','balance',state.balance,'number','min="1" step="0.01"')}<div class="actions">${button('Save planning capital','savebalance','primary')}${button('Read broker balance','sync')}</div><p><small>Manual planning capital never changes broker funds. Live balance is read only on request.</small></p><div id="marginstatus"></div></section>`}
function brokerStatusMarkup(){return rows([['Zerodha',apiState.broker?.linked?'Linked · '+esc(apiState.broker.account):'Not linked'],['Broker session',apiState.broker?.sessionVerified?'Verified by balance request':'Not verified'],['Supabase',apiState.user?'Connected':apiState.available?'Configured':'Not configured'],['Live execution','Disabled'],['OpenAI','Not configured']])}
async function loadBrokerStatus(){try{apiState.broker=await apiRequest('/api/broker/status');const out=document.querySelector('#brokerstatus');if(out)out.innerHTML=brokerStatusMarkup()}catch(e){toast(e.message)}}
function admin(){if(apiState.user&&apiState.user.role!=='admin')return head('Administrator access required','Your membership cannot administer other accounts.');return head(apiState.user?'Administration':'Admin preview','Membership and invitation controls.')+`<section class="panel"><h2>Invite a member</h2><p class="muted">${apiState.user?'Create an invitation link, valid for 48 hours and usable once. No email is sent automatically.':'Admin authentication and Supabase are required to create invitations.'}</p><form id="inviteform">${field('Invitation email','inviteemail','','email','required placeholder="member@example.com"')}<button class="primary">Create invitation</button></form><p id="invitemessage" role="status"></p><div id="invitelink"></div></section><section class="panel"><h2>Members</h2><div id="memberslist">${apiState.user?'Loading members…':'No authenticated membership data.'}</div></section><section class="panel"><h2>Invitations</h2><div id="invitationslist">${apiState.user?'Loading invitations…':'No authenticated invitation data.'}</div><p><small>Expired or failed invitations require review. Revocation is available while an invitation is pending.</small></p></section>`}
async function loadMembers(){try{const [m,i]=await Promise.all([apiRequest('/api/admin/members'),apiRequest('/api/admin/invitations')]);if(route!=='admin')return;document.querySelector('#memberslist').innerHTML=m.members.map(member=>`<div class="summaryrow"><span>${esc(member.email)} · ${esc(member.role)} · ${esc(member.status)}</span>${member.role==='trader'&&member.status==='active'?button('Suspend','suspend:'+member.user_id,'danger'):''}</div>`).join('')||'<p>No members.</p>';document.querySelector('#invitationslist').innerHTML=i.invitations.map(inv=>`<div class="summaryrow"><span>${esc(inv.email)} · ${esc(inv.status)}</span>${inv.status==='pending'?button('Revoke','revoke:'+inv.id,'danger'):''}</div>`).join('')||'<p>No invitations.</p>'}catch(e){toast(e.message)}}
function acceptInvite(){return `<main class="login"><span class="brand">${brand()}</span><h2>Accept your invitation.</h2><p class="muted">Choose the password for your invited membership.</p><form id="acceptform">${field('New password · at least 12 characters','newpassword','','password','required minlength="12" maxlength="128" autocomplete="new-password"')}<button class="primary">Create my membership</button></form><p id="acceptmessage" role="status"></p></main>`}
async function loadPrivateWorkspace(user){const result=await apiRequest('/api/workspace');apiState.user=user;state={...structuredClone(defaults),...result.data,drafts:[],trades:[]};apiState.broker=null;go('home')}
async function initializeBackend(){if(location.protocol==='file:')return;try{const cfg=await apiRequest('/api/config');apiState.available=cfg.authenticationConfigured;if(!apiState.available)return;const fragment=new URLSearchParams(location.hash.slice(1));if(fragment.has('invite')){apiState.inviteToken=fragment.get('invite');history.replaceState(null,'',location.pathname);route='accept';render();return}let current;try{current=await apiRequest('/api/me')}catch{return}await loadPrivateWorkspace(current.user);if(fragment.get('broker')==='connected'){history.replaceState(null,'',location.pathname);go('settings');toast('Broker linked. Read the balance to verify the current session.')}}catch{/* A standalone preview remains usable when no API exists. */}}
function render(){app.innerHTML=route==='accept'?acceptInvite():route==='landing'?landing():route==='login'?login():shell(({home:overview,today,watchlist,calculator,orders,tradebook,reports,strategy,chat:chatPage,settings,admin}[route]||overview)());if(route==='calculator'&&document.querySelector('#calcform'))updateCalc();const navEl=document.querySelector('.navlist'),active=document.querySelector('.navlist .active');if(navEl&&active)navEl.scrollLeft=Math.max(0,active.offsetLeft-navEl.offsetLeft-navEl.clientWidth/2+active.clientWidth/2)}
app.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;
if(nav.some(([r])=>r===a)||['landing','login'].includes(a)){go(a);return}
if(a==='samples'){scanned=true;render()}
if(a.startsWith('chart:')){chartSymbol=a.slice(6);render()}
if(a.startsWith('interval:')){chartInterval=a.slice(9);document.querySelector('#quotechart').innerHTML=quoteChart()}
if(a.startsWith('prompt:')){const q=document.querySelector('#question');q.value=a.slice(7);q.focus()}
if(a==='scan')toast('Live analysis is unavailable. Load the sample shortlist to explore the workflow.');
if(a.startsWith('add:')){const s=a.split(':')[1];if(!state.watch.includes(s))state.watch.push(s);persist();render();toast('Added to your local watchlist.')}
if(a==='addall'){state.watch=[...new Set([...state.watch,...stockData.map(s=>s.symbol)])];persist();render();toast('All 10 sample instruments added.')}
if(a.startsWith('remove:')){state.watch=state.watch.filter(x=>x!==a.split(':')[1]);persist();render()}
if(a.startsWith('calc:')){selected=a.split(':')[1];go('calculator')}
if(a==='prepare'&&lastCalc&&!lastCalc.overRisk&&!lastCalc.overFunds&&lastCalc.qty>0){state.drafts.push({...lastCalc,id:crypto.randomUUID(),createdAt:new Date().toISOString()});persist();go('orders');toast('Plan added. No broker order was placed.')}
if(a.startsWith('draftremove:')){state.drafts.splice(+a.split(':')[1],1);persist();render()}
if(a==='live')toast('Live execution is disabled. No broker order was attempted.');
if(a==='connect'){if(!apiState.user){toast('Sign in to a configured backend before connecting Zerodha.');return}try{const result=await apiRequest('/api/broker/connect',{method:'POST',body:{}});window.location.assign(result.url)}catch(e){toast(e.message)}}
if(a==='sync'){if(!apiState.user){toast('Sign in and connect Zerodha to read your balance.');return}try{const result=await apiRequest('/api/broker/margins');if(result.liveBalance===null)throw Error('Broker live balance is unavailable. No manual value was changed.');if(result.liveBalance<=0)throw Error('Broker live balance is not positive. No planning capital was changed.');state.balance=result.liveBalance;persist();apiState.broker={...apiState.broker,sessionVerified:true};const capital=document.querySelector('#capital'),balance=document.querySelector('#balance');if(capital){capital.value=state.balance;updateCalc()}if(balance)balance.value=state.balance;const status=document.querySelector('#marginstatus');if(status)status.textContent='Live balance '+money(result.liveBalance)+' · fetched '+new Date(result.asOf).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})+' IST';toast('Broker live balance read. Planning capital updated.')}catch(e){toast(e.message)}}
if(a==='logout'){try{await saveQueue;await apiRequest('/api/auth/logout',{method:'POST',body:{}});apiState.user=null;apiState.broker=null;chat=[];state=structuredClone(defaults);go('login')}catch(e){toast(e.message)}}
if(a==='disconnect'){try{await apiRequest('/api/broker/disconnect',{method:'POST',body:{}});apiState.broker=null;go('settings');toast('Local broker link removed. Existing positions are unchanged.')}catch(e){toast(e.message)}}
if(a.startsWith('revoke:')||a.startsWith('suspend:')){const action=a.split(':')[0],id=a.split(':')[1];if(!confirm(action==='revoke'?'Revoke this pending invitation?':'Suspend this trader and revoke their application sessions?'))return;try{await apiRequest(action==='revoke'?'/api/admin/invitations/'+id+'/revoke':'/api/admin/members/'+id+'/suspend',{method:'POST',body:{}});await loadMembers();toast('Membership administration updated.')}catch(e){toast(e.message)}}
if(a==='print')window.print();
if(a==='import')toast('Excel/CSV import requires the validated backend importer. It is specified in the build plan, not implemented in this preview.');
if(a==='savestrategy'){state.strategy=document.querySelector('#strategyname').value;state.notes=document.querySelector('#strategynotes').value;persist();toast(apiState.user?'Strategy save queued.':'Strategy draft saved locally.')}
if(a==='saverules'){state.rules=document.querySelector('#rules').value;persist();toast(apiState.user?'Rules save queued.':'Rules saved locally.')}
if(a==='savebalance'){const v=+document.querySelector('#balance').value;if(Number.isFinite(v)&&v>0){state.balance=v;persist();toast(apiState.user?'Planning capital save queued.':'Manual planning capital saved.')}else toast('Enter a positive capital value.')}
if(a==='clear'&&confirm('Clear the prototype watchlist, plans and written rules from this browser?')){state=structuredClone(defaults);persist();render()}
});
app.addEventListener('input',e=>{if(e.target.closest('#calcform')){if(e.target.id==='symbol'){selected=e.target.value;document.querySelector('#entry').value=stockData.find(s=>s.symbol===selected).price}updateCalc()}});
app.addEventListener('change',e=>{if(e.target.id==='period'){period=e.target.value;render()}});
app.addEventListener('submit',async e=>{e.preventDefault();
 if(e.target.id==='loginform'){
  if(!apiState.available){document.querySelector('#password').value='';document.querySelector('#loginmessage').textContent='Authentication is not configured. Use the preview without credentials.';return}
  const submit=e.target.querySelector('button[type="submit"]');submit.disabled=true;
  try{const result=await apiRequest('/api/auth/login',{method:'POST',body:{email:document.querySelector('#email').value,password:document.querySelector('#password').value}});document.querySelector('#password').value='';await loadPrivateWorkspace(result.user)}catch(err){const p=document.querySelector('#password');if(p)p.value='';const m=document.querySelector('#loginmessage');if(m)m.textContent=err.message}finally{submit.disabled=false}
 }
 if(e.target.id==='inviteform'){if(!apiState.user){document.querySelector('#invitemessage').textContent='Invitation not created. Administrator login is required.';return}const b=e.target.querySelector('button');b.disabled=true;try{const result=await apiRequest('/api/admin/invitations',{method:'POST',body:{email:document.querySelector('#inviteemail').value}});document.querySelector('#invitemessage').textContent='Invitation created. No email was sent. Share the link only with the intended member.';document.querySelector('#invitelink').innerHTML=field('Private invitation link','createdinvite',result.url,'text','readonly');await loadMembers()}catch(err){document.querySelector('#invitemessage').textContent=err.message}finally{b.disabled=false}}
 if(e.target.id==='acceptform'){const b=e.target.querySelector('button');b.disabled=true;try{await apiRequest('/api/invitations/accept',{method:'POST',body:{token:apiState.inviteToken,password:document.querySelector('#newpassword').value}});apiState.inviteToken=null;go('login');toast('Membership created. Sign in with your invited email and chosen password.')}catch(err){document.querySelector('#newpassword').value='';document.querySelector('#acceptmessage').textContent=err.message}finally{b.disabled=false}}
 if(e.target.id==='chatform'){const question=document.querySelector('#question').value.trim();if(!question)return;chat.push({role:'user',text:question},{role:'assistant',text:'OpenAI is not connected. No question was sent to an AI service.'});render()}
});
render();
/* This isolated demonstration never connects to member APIs. */
</script></body></html>
