# Local or single-server deployment: the app, the live market data feed and MongoDB.
# Usage: cp .env.example .env  (set SESSION_SECRET, APP_URL, …)  then  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    # Matches the 30 s request drain in server.js (Docker's default is 10 s).
    stop_grace_period: 35s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the container (.env.production.example's 127.0.0.1 would refuse the port mapping).
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/blank?replicaSet=rs0
      # The app listens on localhost only; put Nginx (HTTPS) in front of it.
      # Production session cookies are Secure, so sign-in needs HTTPS.
      TRUST_PROXY: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mongo:
        condition: service_healthy

  # The live market data feed (one TrueData connection per login, so exactly one).
  # Idle until a TrueData login is set in the admin panel → Integrations.
  feed:
    build: .
    restart: unless-stopped
    command: ['node', 'scripts/market-feed.js']
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/blank?replicaSet=rs0
    # The image's health check calls the web server, which this container does not run.
    healthcheck:
      disable: true
    depends_on:
      mongo:
        condition: service_healthy

  # A one-node replica set (rs0), so more nodes can join later. The health check initiates it once
  # (also on an existing standalone volume) and is healthy only when this node is the primary.
  # Its member name "mongo" resolves inside the Compose network, where the app connects.
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['--replSet', 'rs0']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
