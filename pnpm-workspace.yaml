# A flat node_modules (no symlinks): uploads and unzip tools on any host keep it intact.
nodeLinker: hoisted
allowBuilds:
  '@parcel/watcher': true
  core-js: false
  mongodb-memory-server: false
# @tailwindcss/cli pins @parcel/watcher 2.5.1, whose micromatch→braces carries
# GHSA-vfj7-8cjw-p6xm. 2.6.0 replaces micromatch with picomatch.
overrides:
  '@parcel/watcher': 2.6.0
  # vitest installs happy-dom as a peer even though the tests use jsdom; 21.0.4 fixes GHSA for CVE-2026-33943.
  happy-dom: ^21.0.4
  # mongodb-memory-server (tests only) pins follow-redirects 1.16.1; 1.16.2 fixes the credential-redirect advisory.
  follow-redirects: ^1.16.2
  # supertest's qs: 6.16.1 fixes the stringify DoS advisory.
  qs: ^6.16.1
